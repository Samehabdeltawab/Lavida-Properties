<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Background -->
  <rect width="48" height="48" rx="6" fill="#19202E"/>
  
  <!-- Building Icon - Simple Design -->
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5">
    <!-- Main building body -->
    <rect x="16" y="12" width="16" height="24" rx="1" fill="none"/>
    
    <!-- Windows - 3 rows -->
    <rect x="18.5" y="15" width="3" height="3" rx="0.5"/>
    <rect x="22.5" y="15" width="3" height="3" rx="0.5"/>
    <rect x="26.5" y="15" width="3" height="3" rx="0.5"/>
    
    <rect x="18.5" y="20" width="3" height="3" rx="0.5"/>
    <rect x="22.5" y="20" width="3" height="3" rx="0.5"/>
    <rect x="26.5" y="20" width="3" height="3" rx="0.5"/>
    
    <rect x="18.5" y="25" width="3" height="3" rx="0.5"/>
    <rect x="22.5" y="25" width="3" height="3" rx="0.5"/>
    <rect x="26.5" y="25" width="3" height="3" rx="0.5"/>
    
    <!-- Door -->
    <rect x="21" y="30" width="6" height="6" rx="0.5"/>
    
    <!-- Side lines for depth -->
    <line x1="16" y1="12" x2="14" y2="14" stroke-width="1.5"/>
    <line x1="32" y1="12" x2="34" y2="14" stroke-width="1.5"/>
    <line x1="14" y1="14" x2="14" y2="36" stroke-width="1.5"/>
    <line x1="34" y1="14" x2="34" y2="36" stroke-width="1.5"/>
    <line x1="14" y1="36" x2="16" y2="36" stroke-width="1.5"/>
    <line x1="34" y1="36" x2="32" y2="36" stroke-width="1.5"/>
  </g>
</svg>
