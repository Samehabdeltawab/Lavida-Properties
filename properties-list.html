<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العقارات المتاحة - Lavida Properties</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-header {
            background: linear-gradient(135deg, #2c5f4f 0%, #4a8c7a 100%);
            padding: 120px 0 60px;
            margin-top: 70px;
            text-align: center;
            color: var(--white);
        }

        .page-header h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .page-header p {
            font-size: 1.3rem;
            opacity: 0.9;
        }

        .properties-section {
            padding: 80px 0;
        }

        .filters-bar {
            background: var(--white);
            padding: 20px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            margin-bottom: 40px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-label {
            font-weight: 600;
            color: var(--text-dark);
        }

        .properties-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .property-card {
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .property-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            border-color: #FFA500;
        }

        .property-badge {
            background: linear-gradient(135deg, #FFA500 0%, #FF8C00 100%);
            color: white;
            padding: 8px 15px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
        }

        .property-details {
            padding: 20px;
        }

        .property-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .property-info-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .property-info-row i {
            color: #FFA500;
            width: 20px;
        }

        .property-price {
            background: var(--bg-light);
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            border-right: 4px solid #FFA500;
        }

        .price-label {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 5px;
        }

        .price-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2c5f4f;
        }

        .property-footer {
            padding: 15px 20px;
            background: var(--bg-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .contact-btn {
            background: linear-gradient(135deg, #2c5f4f 0%, #4a8c7a 100%);
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .contact-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(44, 95, 79, 0.3);
        }

        .no-properties {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        .no-properties i {
            font-size: 4rem;
            color: #e0e0e0;
            margin-bottom: 20px;
        }

        .no-properties h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--text-dark);
        }

        .back-button {
            display: inline-block;
            margin-bottom: 30px;
            padding: 12px 30px;
            background: var(--white);
            color: var(--text-dark);
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid #e0e0e0;
        }

        .back-button:hover {
            background: var(--bg-light);
            border-color: #FFA500;
        }

        .back-button i {
            margin-left: 10px;
        }

        .results-count {
            font-size: 1.1rem;
            color: var(--text-light);
            margin-bottom: 20px;
        }

        .results-count strong {
            color: var(--text-dark);
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <div class="container">
                <div class="nav-wrapper">
                    <ul class="nav-links">
                        <li><a href="index.html#home">الرئيسية</a></li>
                        <li><a href="index.html#services">خدماتنا</a></li>
                        <li><a href="index.html#contact">تواصل معنا</a></li>
                    </ul>
                    <div class="logo">
                        <h1>Lavida Properties</h1>
                    </div>
                    <button class="menu-toggle" id="menuToggle">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <!-- Page Header -->
    <div class="page-header">
        <div class="container">
            <h1 id="pageTitle"><i class="fas fa-building"></i> العقارات المتاحة</h1>
            <p id="pageSubtitle">تصفح أفضل العقارات</p>
        </div>
    </div>

    <!-- Properties Section -->
    <section class="properties-section">
        <div class="container">
            <a href="javascript:history.back()" class="back-button">
                <i class="fas fa-arrow-right"></i>
                رجوع
            </a>

            <div class="results-count" id="resultsCount">
                جاري التحميل...
            </div>

            <div class="properties-grid" id="propertiesContainer">
                <div class="no-properties">
                    <i class="fas fa-spinner fa-spin"></i>
                    <h3>جاري تحميل العقارات...</h3>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>جميع الحقوق محفوظة - Lavida Properties &copy; 2026</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        // Translation maps
        const unitTypeLabels = {
            'apartment': 'شقة',
            'villa': 'فيلا',
            'duplex': 'دوبلكس',
            'ground-garden': 'أرضي بجاردن',
            'ground': 'أرضي'
        };

        const floorLabels = {
            'ground': 'أرضي',
            'first': 'الأول',
            'second': 'الثاني',
            'third': 'الثالث',
            'fourth': 'الرابع',
            'fifth': 'الخامس',
            'sixth': 'السادس',
            'seventh': 'السابع',
            'eighth': 'الثامن',
            'ninth': 'التاسع',
            'tenth': 'العاشر'
        };

        const finishingLabels = {
            'none': 'بدون تشطيب',
            'half': 'نصف تشطيب',
            'full': 'مشطب بالكامل',
            'with-ac': 'مشطب بالتكييفات'
        };

        const directionLabels = {
            'front': 'أمامية',
            'side': 'جانبية',
            'back': 'خلفية'
        };

        const paymentMethodLabels = {
            'cash': 'كاش',
            'installment': 'تقسيط'
        };

        const installmentTypeLabels = {
            'monthly': 'شهري',
            'quarterly': 'ربع سنوي'
        };

        const propertyTypeLabels = {
            'residential': 'سكني',
            'commercial': 'تجاري',
            'administrative': 'إداري',
            'clinic': 'عيادة'
        };

        const categoryLabels = {
            'areas': 'مناطق',
            'compounds': 'كمبوندات'
        };

        // Get URL parameters
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        // Format number with commas
        function formatPrice(price) {
            return new Intl.NumberFormat('ar-EG').format(price) + ' جنيه';
        }

        // Get time ago
        function getTimeAgo(timestamp) {
            const now = new Date();
            const then = new Date(timestamp);
            const diffMs = now - then;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 60) return diffMins === 0 ? 'دقائق' : `${diffMins} دقيقة`;
            if (diffHours < 24) return `${diffHours} ساعة`;
            return `${diffDays} يوم`;
        }

        // Create property card HTML
        function createPropertyCard(property) {
            const typeLabel = propertyTypeLabels[property.propertyType] || property.propertyType;
            const unitTypeLabel = unitTypeLabels[property.unitType] || '';
            const floorLabel = floorLabels[property.floor] || property.floor;
            const finishingLabel = finishingLabels[property.finishing] || property.finishing;
            const directionLabel = directionLabels[property.direction] || property.direction;
            const paymentLabel = paymentMethodLabels[property.paymentMethod] || property.paymentMethod;
            const categoryLabel = categoryLabels[property.category] || '';
            
            let paymentDetails = paymentLabel;
            if (property.paymentMethod === 'installment' && property.installmentType) {
                const installmentLabel = installmentTypeLabels[property.installmentType] || property.installmentType;
                paymentDetails += ` (${installmentLabel})`;
            }

            const displayTitle = property.propertyType === 'residential' && unitTypeLabel 
                ? `${unitTypeLabel} في ${property.city}`
                : `${typeLabel} في ${property.city}`;

            const badgeText = property.propertyType === 'residential' && unitTypeLabel 
                ? `${unitTypeLabel} - ${property.city}`
                : `${typeLabel} - ${property.city}`;

            return `
                <div class="property-card">
                    <div class="property-badge">${badgeText}</div>
                    <div class="property-details">
                        <div class="property-title">
                            <i class="fas fa-home"></i>
                            ${displayTitle}
                        </div>
                        
                        <div class="property-info-row">
                            <i class="fas fa-map-marker-alt"></i>
                            <span>${property.city} - ${property.governorate}</span>
                        </div>
                        
                        ${categoryLabel ? `
                        <div class="property-info-row">
                            <i class="fas fa-tag"></i>
                            <span>${categoryLabel}</span>
                        </div>
                        ` : ''}
                        
                        <div class="property-info-row">
                            <i class="fas fa-ruler-combined"></i>
                            <span>المساحة: ${property.area} متر مربع</span>
                        </div>
                        
                        <div class="property-info-row">
                            <i class="fas fa-layer-group"></i>
                            <span>الطابق: ${floorLabel}</span>
                        </div>
                        
                        <div class="property-info-row">
                            <i class="fas fa-paint-roller"></i>
                            <span>التشطيب: ${finishingLabel}</span>
                        </div>
                        
                        <div class="property-info-row">
                            <i class="fas fa-compass"></i>
                            <span>الوجهة: ${directionLabel}</span>
                        </div>
                        
                        <div class="property-info-row">
                            <i class="fas fa-credit-card"></i>
                            <span>الدفع: ${paymentDetails}</span>
                        </div>
                        
                        <div class="property-price">
                            <div class="price-label">السعر الإجمالي</div>
                            <div class="price-value">${formatPrice(property.totalPrice)}</div>
                            ${property.downPayment ? `<div class="price-label" style="margin-top: 8px;">الدفعة المقدمة: ${formatPrice(property.downPayment)}</div>` : ''}
                        </div>
                        
                        ${property.description ? `
                        <div class="property-info-row" style="margin-top: 15px; display: block;">
                            <i class="fas fa-info-circle"></i>
                            <span style="display: block; margin-top: 5px; line-height: 1.6;">${property.description}</span>
                        </div>
                        ` : ''}
                    </div>
                    <div class="property-footer">
                        <span style="font-size: 0.85rem; color: var(--text-light);">
                            <i class="fas fa-clock"></i> منذ ${getTimeAgo(property.timestamp)}
                        </span>
                        <a href="index.html#contact" class="contact-btn">
                            <i class="fas fa-phone"></i>
                            اتصل بنا
                        </a>
                    </div>
                </div>
            `;
        }

        // Load and filter properties
        function loadProperties() {
            const propertyType = getUrlParameter('type');
            const category = getUrlParameter('category');
            const city = getUrlParameter('city');
            const governorate = getUrlParameter('governorate');

            // Update page title
            let title = 'العقارات المتاحة';
            let subtitle = 'تصفح أفضل العقارات';

            if (city) {
                title = `العقارات في ${city}`;
                subtitle = `جميع العقارات المتاحة في ${city}`;
            } else if (category) {
                const catLabel = categoryLabels[category] || category;
                title = `${catLabel}`;
                subtitle = `تصفح العقارات في ${catLabel}`;
            } else if (propertyType) {
                const typeLabel = propertyTypeLabels[propertyType] || propertyType;
                title = `عقارات ${typeLabel}`;
                subtitle = `جميع العقارات ${typeLabel}ة المتاحة`;
            }

            document.getElementById('pageTitle').innerHTML = `<i class="fas fa-building"></i> ${title}`;
            document.getElementById('pageSubtitle').textContent = subtitle;

            // Load properties from localStorage
            const allProperties = JSON.parse(localStorage.getItem('lavidaProperties') || '[]');
            
            // Filter properties
            let filteredProperties = allProperties.filter(property => {
                let match = true;
                
                if (propertyType && property.propertyType !== propertyType) {
                    match = false;
                }
                
                if (category && property.category !== category) {
                    match = false;
                }
                
                if (city && property.city !== city) {
                    match = false;
                }
                
                if (governorate && property.governorate !== governorate) {
                    match = false;
                }
                
                return match;
            });

            // Display results count
            const resultsCount = document.getElementById('resultsCount');
            resultsCount.innerHTML = `تم العثور على <strong>${filteredProperties.length}</strong> عقار`;

            // Display properties
            const container = document.getElementById('propertiesContainer');
            
            if (filteredProperties.length > 0) {
                container.innerHTML = filteredProperties.map(p => createPropertyCard(p)).join('');
            } else {
                container.innerHTML = `
                    <div class="no-properties">
                        <i class="fas fa-search"></i>
                        <h3>لا توجد عقارات متاحة</h3>
                        <p>لم يتم العثور على عقارات تطابق معايير البحث</p>
                    </div>
                `;
            }
        }

        // Load properties when page loads
        window.addEventListener('load', loadProperties);
    </script>
</body>
</html>
